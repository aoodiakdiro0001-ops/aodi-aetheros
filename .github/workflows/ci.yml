name: AetherOS CI

on: [push, pull_request, workflow_dispatch]

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: py_compile every core module
        run: python -m py_compile core/*.py
      - name: offline test suite (35 tests)
        run: python -m unittest discover tests -v
  go-hub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        working-directory: mesh
        run: go vet ./...
      - name: build ae-mesh
        working-directory: mesh
        run: go build -o ../bin/ae-mesh .

  node-relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: syntax check relay (no npm deps)
        run: node --check relay/relay.js
